name: sync-upstream

on:
  schedule:
    - cron: '0 1 */2 * *' # 每两天 09:00 北京（月末从 31 号到 1 号可能连续或空一天，影响可忽略）
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/ccch1mneyyy/dsh-go.git 2>/dev/null || git remote set-url upstream https://github.com/ccch1mneyyy/dsh-go.git
          git fetch upstream main

      - name: Upstream ahead?
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "behind=false" >> $GITHUB_OUTPUT
            echo "already up to date"
          else
            echo "behind=true" >> $GITHUB_OUTPUT
            echo "upstream has new commits: $(git rev-list --count HEAD..upstream/main)"
          fi

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.behind == 'true'
        continue-on-error: true
        run: |
          git config user.name "dsh-go-sync"
          git config user.email "sync@dsh-go.local"

          # 我们改过的文件：冲突时一律保留我们的版本
          OURS="README.md \
            app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/phone/PhoneCore.kt \
            app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/phone/PhoneControl.kt \
            app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/phone/PhonePlugin.kt \
            app/android/app/src/main/kotlin/io/github/ccch1mneyyy/dsh_app/phone/PhoneToolCatalog.kt \
            app/lib/phone/phone_channel.dart \
            app/lib/state/phone_state.dart \
            app/lib/ui/chat/chat_screen.dart \
            app/lib/ui/chat/dock/chat_dock.dart \
            app/lib/ui/plugins/plugin_detail_sheet.dart \
            app/lib/ui/plugins/plugin_inventory_page.dart \
            app/lib/ui/settings/settings_screen.dart \
            app/lib/update/update_config.dart"

          OURS_VERSION=$(git show HEAD:app/pubspec.yaml | sed -n 's/^version:[[:space:]]*//p')
          TOUCHED=$(git diff --name-only upstream/main HEAD -- $OURS | tr '\n' ' ')

          # 冲突也不再 abort：按名单逐个决定留谁
          git merge --no-ff --no-commit upstream/main || true

          # 1) 我们的文件 + .github 全部用我们的
          for f in $OURS .github; do
            git checkout HEAD -- "$f" 2>/dev/null || true
          done

          # 2) pubspec 用上游的（依赖/SDK 跟上游），只把 version 行改回我们的
          git show upstream/main:app/pubspec.yaml > app/pubspec.yaml
          sed -i "s|^version:.*|version: $OURS_VERSION|" app/pubspec.yaml

          # 3) 名单外的冲突文件一律用上游
          git diff --name-only --diff-filter=U | while read -r f; do
            git checkout --theirs -- "$f" 2>/dev/null || true
          done

          git add -A
          git commit -m "sync: merge upstream $(git rev-parse --short upstream/main) [skip ci]" \
            -m "上游动过、但按规则保留我们的文件：${TOUCHED:-无}"
          echo "TOUCHED=$TOUCHED" >> $GITHUB_OUTPUT

      - name: Check fork features
        if: steps.check.outputs.behind == 'true' && steps.merge.outcome == 'success'
        run: bash scripts/check-fork-symbols.sh

      - name: Open issue on conflict
        if: steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo ghjicb/dsh-Go \
            --title "同步上游冲突：$(date -u +%F)" \
            --body "上游 $(git rev-parse --short upstream/main) 和我们改过的文件冲突，自动合并失败。工作流 run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}。需要人看一下再合并。" || true

      - name: Push main
        if: steps.check.outputs.behind == 'true' && steps.merge.outcome == 'success'
        run: |
          # 合并 commit 已在 Merge upstream 步骤里创建
          git push origin HEAD:main

      - name: Trigger release build
        if: steps.check.outputs.behind == 'true' && steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-apk.yml --repo ghjicb/dsh-Go --ref main -f release=true

      - name: Note files upstream touched
        if: steps.check.outputs.behind == 'true' && steps.merge.outputs.TOUCHED != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo ghjicb/dsh-Go \
            --title "上游动过我们改的文件：$(date -u +%F)" \
            --body "这次同步上游改到了下面这些文件，按规则保留了我们的版本，上游的改动没有自动进来，需要的话人工合并：
          `${{ steps.merge.outputs.TOUCHED }}`
          run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
